<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coco-lab</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="plainwalk/icon.png">
</head>
<body>
<div class="wrap">

<header class="site">
  <h1>coco-lab</h1>
  <p>日々の道具になる、小さなiOSアプリを作っています。</p>
</header>

<main>
  <a class="card" href="plainwalk/">
    <img src="plainwalk/icon.png" alt="PlainWalk">
    <div>
      <div class="name">PlainWalk</div>
      <div class="desc">歩いた道が、地図になる。白地図を自分の足で開拓する散歩アプリ。</div>
    </div>
  </a>

  <a class="card" href="threesecstart/">
    <img src="threesecstart/icon.png" alt="3秒スタート">
    <div>
      <div class="name">3秒スタート</div>
      <div class="desc">考える前に、動く。宣言したら3秒後に必ず始まるタスクアプリ。</div>
    </div>
  </a>

  <a class="card" href="moyashi/">
    <img src="moyashi/icon.png" alt="もやし。">
    <div>
      <div class="name">もやし。</div>
      <div class="desc">スマホを置くほど、育つ。置いた時間だけもやしが育つ集中アプリ。</div>
    </div>
  </a>

  <a class="card" href="mochichara/">
    <img src="mochichara/icon.png" alt="もちキャラ">
    <div>
      <div class="name">もちキャラ</div>
      <div class="desc">キャラの資料、ぜんぶポケットに。参考画像とプロンプトをまとめる管理帳。</div>
    </div>
  </a>

  <p class="soon">そのほかのアプリは準備中です。</p>
</main>

<footer>
  お問い合わせ: <a href="mailto:kkantajh0108@gmail.com">kkantajh0108@gmail.com</a>
</footer>

</div>
</body>
</html>
